name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    uses: mupinnn/parachute/.github/workflows/deploy.yml@main
    permissions:
      contents: read
      packages: write
    with:
      deployment-name: cakyu-helper
      type: compose
      compose-file: docker-compose.prod.yml
      spec-file: parachute.toml
      join-tailscale: true
    secrets:
      parachute-url: ${{ secrets.PARACHUTE_URL }}
      deploy-token: ${{ secrets.PARACHUTE_DEPLOY_TOKEN }}
      tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
