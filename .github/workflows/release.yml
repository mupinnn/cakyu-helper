name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without v prefix, e.g. 1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Invalid Chrome extension version: $VERSION"
            exit 1
          fi
          TAG="v${VERSION}"
          ZIP="cakyu-helper-${TAG}.zip"
          XPI="cakyu-helper-${TAG}.xpi"
          FOLDER="cakyu-helper-${TAG}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "xpi=${XPI}" >> "$GITHUB_OUTPUT"
          echo "folder=${FOLDER}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: bun install

      - name: Stamp manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' apps/extension/manifest.json \
            > apps/extension/manifest.json.tmp
          mv apps/extension/manifest.json.tmp apps/extension/manifest.json

      - name: Build extension
        run: bun run --filter @cakyu-helper/extension build

      - name: Package Chromium zip
        env:
          ZIP: ${{ steps.version.outputs.zip }}
          FOLDER: ${{ steps.version.outputs.folder }}
        run: |
          set -euo pipefail
          mkdir -p "dist-release/${FOLDER}"
          cp -a apps/extension/dist/. "dist-release/${FOLDER}/"
          test -f "dist-release/${FOLDER}/manifest.json"
          python3 - "$ZIP" "$FOLDER" <<'PY'
          import os, shutil, sys
          zip_name, folder = sys.argv[1], sys.argv[2]
          shutil.make_archive(
              os.path.splitext(zip_name)[0],
              "zip",
              root_dir="dist-release",
              base_dir=folder,
          )
          PY

      - name: Package AMO source zip
        run: |
          set -euo pipefail
          mkdir -p dist-firefox
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          import zipfile

          out = Path("dist-firefox/cakyu-helper-source.zip")
          skip = {"dist", "node_modules", "web-ext-artifacts"}
          build_txt = textwrap.dedent("""\
          Cakyu Helper — source for AMO reviewers

          The GitHub Release .xpi is a minified Bun bundle of apps/extension.

          Rebuild:

          1. Install Bun 1.3.3 or newer (https://bun.sh)
          2. bun install
          3. bun run --filter @cakyu-helper/extension build
          4. Compare apps/extension/dist with the uploaded minified files
          """)

          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
              zf.writestr("BUILD.txt", build_txt)
              for name in ("package.json", "bun.lock", "turbo.json"):
                  zf.write(name, name)
              for path in Path("apps/extension").rglob("*"):
                  if any(part in skip for part in path.parts):
                      continue
                  if path.is_file():
                      zf.write(path, path.as_posix())
          print(f"wrote {out}")
          PY

      - name: Sign Firefox XPI
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          XPI: ${{ steps.version.outputs.xpi }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$AMO_API_KEY" ] || [ -z "$AMO_API_SECRET" ]; then
            echo "AMO_API_KEY and AMO_API_SECRET are required to sign the Firefox XPI"
            exit 1
          fi
          GECKO_ID="$(jq -r '.browser_specific_settings.gecko.id' apps/extension/manifest.json)"
          export GECKO_ID
          mkdir -p dist-firefox
          set +e
          python3 scripts/fetch-amo-xpi.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Reused already-signed XPI from AMO"
            exit 0
          fi
          if [ "$status" -eq 2 ]; then
            echo "This version is still awaiting AMO review. Re-run the workflow after it is approved."
            exit 1
          fi
          if [ "$status" -ne 3 ]; then
            exit "$status"
          fi
          ./apps/extension/node_modules/.bin/web-ext sign \
            --source-dir apps/extension/dist \
            --channel unlisted \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --artifacts-dir dist-firefox \
            --upload-source-code dist-firefox/cakyu-helper-source.zip \
            --timeout 300000 \
            --approval-timeout 900000
          SIGNED="$(find dist-firefox -maxdepth 1 -name '*.xpi' | head -n 1)"
          test -n "$SIGNED"
          mv "$SIGNED" "$XPI"

      - name: Checksums and Firefox update manifest
        id: package
        env:
          ZIP: ${{ steps.version.outputs.zip }}
          XPI: ${{ steps.version.outputs.xpi }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, os, pathlib

          zip_name = os.environ["ZIP"]
          xpi_name = os.environ["XPI"]
          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repository = os.environ["REPOSITORY"]
          gecko_id = json.loads(
              pathlib.Path("apps/extension/manifest.json").read_text(encoding="utf-8")
          )["browser_specific_settings"]["gecko"]["id"]

          def sha256_file(path: str) -> str:
              digest = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          zip_sha = sha256_file(zip_name)
          xpi_sha = sha256_file(xpi_name)
          xpi_url = (
              f"https://github.com/{repository}/releases/download/{tag}/{xpi_name}"
          )
          updates = {
              "addons": {
                  gecko_id: {
                      "updates": [
                          {
                              "version": version,
                              "update_link": xpi_url,
                              "update_hash": f"sha256:{xpi_sha}",
                          }
                      ]
                  }
              }
          }
          updates_name = "firefox-updates.json"
          pathlib.Path(updates_name).write_text(
              json.dumps(updates, indent=2) + "\n",
              encoding="utf-8",
          )
          updates_sha = sha256_file(updates_name)

          lines = [
              f"{zip_sha}  {zip_name}",
              f"{xpi_sha}  {xpi_name}",
              f"{updates_sha}  {updates_name}",
          ]
          pathlib.Path("SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"sha256={zip_sha}\n")
              fh.write(f"xpi_sha256={xpi_sha}\n")
              fh.write(f"updates_sha256={updates_sha}\n")

          print("\n".join(lines))
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Checksum (SHA-256):

                ${{ steps.package.outputs.sha256 }}  ${{ steps.version.outputs.zip }}
                ${{ steps.package.outputs.xpi_sha256 }}  ${{ steps.version.outputs.xpi }}
                ${{ steps.package.outputs.updates_sha256 }}  firefox-updates.json
          files: |
            ${{ steps.version.outputs.zip }}
            ${{ steps.version.outputs.xpi }}
            firefox-updates.json
            SHA256SUMS
